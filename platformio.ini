; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---- MASTER (the arm-worn ESP32) --------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; the slave test sketch lives in src/slave_rx_test and must not be linked into the master
build_src_filter = +<*> -<slave_rx_test/>
lib_deps = 
	hideakitai/MPU9250@^0.4.8
	wollewald/MPU9250_WE@^1.2.17
upload_port = COM7
monitor_speed = 115200

; ---- SLAVE receiver test sketch (prints what the robot ESP32 would receive) --
; pio run -e slave_test -t upload   (set upload_port to the slave's port)
[env:slave_test]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<slave_rx_test/>
lib_deps = 
	wollewald/MPU9250_WE@^1.2.17
monitor_speed = 115200
