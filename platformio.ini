; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
monitor_rts = 0
monitor_dtr = 0


[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = 
	-<*> +<master/>>
lib_deps = 
	wollewald/MPU9250_WE@^1.2.17
upload_port = COM10
monitor_speed = 115200

[env:slave_test]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = 
	-<*> +<slave_rx_test/>
lib_deps = 
	wollewald/MPU9250_WE@^1.2.17
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7

[env:MPUWhoAmI]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = 
	-<*> +<MPUWhoAmI/>
lib_deps = 
	wollewald/MPU9250_WE@^1.2.17
	hideakitai/MPU9250 @ 0.4.8
upload_port = COM7
monitor_speed = 115200

[env:a4988_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = 
	-<*> +<a4988_test/>

[env:ESPNow_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = 
	-<*> +<ESPNow_test/>

; TeleArm slave (steppers, AS5600, homing, E-stop). FastAccelStepper 2.0.1 is the compile-checked version;
; if the registry does not have it use https://github.com/gin66/FastAccelStepper.git#2.0.1
[env:slave]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = 
	-<*> +<slave/>
lib_deps = 
	wollewald/MPU9250_WE@^1.2.17
	gin66/FastAccelStepper@2.0.1
monitor_speed = 115200
